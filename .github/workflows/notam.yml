name: NOTAM
# Henter NOTAM for Norge hver halvtime og legger dem på grenen notam-data,
# som VFR-appen leser fra raw.githubusercontent.com.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-branch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            flyapp/scripts
            vfr/data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hent NOTAM
        run: node flyapp/scripts/notam-fetch.mjs "$RUNNER_TEMP/notam.json"
        env:
          PREVIOUS_URL: https://raw.githubusercontent.com/${{ github.repository }}/notam-data/notam.json
      - name: Publiser til notam-data
        run: bash flyapp/scripts/publish-data.sh "$RUNNER_TEMP/notam.json"
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
