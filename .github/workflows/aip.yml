name: AIP-data
# Sjekker hver dag om Avinor har publisert en ny utgave av AIP Norge (AIRAC hver 28. dag),
# og om luftromskilden (relet/pg-xc) har fått nyere data.
# Ved ny utgave hentes alle AIP-baserte data på nytt (frekvenser, telefonnumre, VFR-punkter
# og -ruter, luftrom, FIR-grense, flyplasser), appen bygges og publiseres til GitHub Pages.
on:
  schedule:
    - cron: '41 4 * * *'
    - cron: '13 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Hent og publiser selv om AIP-utgaven er den samme'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sjekk AIP-utgave
        id: ed
        run: node flyapp/scripts/aip-edition.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Installer avhengigheter
        if: steps.ed.outputs.changed == 'true' || steps.ed.outputs.airspace_changed == 'true' || inputs.force
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          cd flyapp && npm ci --no-audit --no-fund
      - name: Hent data, test og bygg
        if: steps.ed.outputs.changed == 'true' || steps.ed.outputs.airspace_changed == 'true' || inputs.force
        run: |
          cd flyapp
          npm run data
          npx vitest run
          # Ny versjon av service workeren, så appene på telefonene oppdaterer seg.
          sed -i -E "s/const APP_CACHE = '[^']*'/const APP_CACHE = 'vfr-app-aip-${{ steps.ed.outputs.current }}-${{ github.run_number }}'/" public/sw.js
          grep -n "APP_CACHE = " public/sw.js
          npm run pages
      - name: Publiser
        if: steps.ed.outputs.changed == 'true' || steps.ed.outputs.airspace_changed == 'true' || inputs.force
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add -A vfr flyapp/public/sw.js
          if git diff --cached --quiet; then echo "Ingen endringer"; exit 0; fi
          git commit -qm "AIP Norge ${{ steps.ed.outputs.current }} / luftrom ${{ steps.ed.outputs.airspace_source }}: oppdaterte data"
          git push -q origin HEAD:main
      - name: Publiser AIP-status (leses av appen ved oppstart)
        if: always() && steps.ed.outputs.current != ''
        run: |
          printf '{"current":"%s","checkedAt":"%s"}\n' "${{ steps.ed.outputs.current }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/aip-status.json"
          bash flyapp/scripts/publish-data.sh "$RUNNER_TEMP/aip-status.json"
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
